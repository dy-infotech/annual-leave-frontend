name: Deploy Flutter Frontend

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze --no-fatal-infos

      - name: 테스트
        run: flutter test

      - name: 웹 빌드
        run: flutter build web --release

      - name: 서버로 배포
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "build/web/*"
          target: "/tmp/flutter-deploy"
          strip_components: 2

      - name: 서버에서 배포 마무리
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_DIR=/opt/annual-leave/front
            CURRENT_DIR=$APP_DIR/web
            NEXT_DIR=$APP_DIR/web.next
            PREVIOUS_DIR=$APP_DIR/web.prev
            STAGING_DIR=/tmp/flutter-deploy

            echo "===== 신규 정적 파일 staging ====="
            sudo rm -rf "$NEXT_DIR"
            sudo mkdir -p "$NEXT_DIR"
            sudo cp -a "$STAGING_DIR"/. "$NEXT_DIR"/
            sudo test -s "$NEXT_DIR/index.html"
            sudo chown -R www-data:www-data "$NEXT_DIR"

            echo "===== 기존 버전 보관 ====="
            sudo rm -rf "$PREVIOUS_DIR"
            if [ -e "$CURRENT_DIR" ]; then
              sudo mv "$CURRENT_DIR" "$PREVIOUS_DIR"
            fi

            rollback() {
              echo "===== Frontend 롤백 ====="
              sudo rm -rf "$CURRENT_DIR"
              if [ -e "$PREVIOUS_DIR" ]; then
                sudo mv "$PREVIOUS_DIR" "$CURRENT_DIR"
              fi
            }
            trap rollback ERR

            echo "===== 신규 버전 전환 ====="
            sudo mv "$NEXT_DIR" "$CURRENT_DIR"
            sudo test -s "$CURRENT_DIR/index.html"
            sudo find "$CURRENT_DIR" -maxdepth 2 -type f | grep -q .

            trap - ERR
            sudo rm -rf "$PREVIOUS_DIR"
            rm -rf "$STAGING_DIR"
            echo "===== Frontend 배포 완료 ====="
