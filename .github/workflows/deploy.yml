name: Deploy Flutter Frontend

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: self-hosted   # GitHub 클라우드가 아닌 배포 서버에서 실행
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 의존성 설치
        run: flutter pub get

      - name: 웹 빌드
        run: flutter build web --release

      - name: 배포 (서버 내부에서 파일 복사)
        run: |
          sudo rm -rf /opt/annual-leave/front/web/*
          sudo cp -r build/web/* /opt/annual-leave/front/web/
          sudo chown -R www-data:www-data /opt/annual-leave/front/web