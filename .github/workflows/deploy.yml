name: Deploy Flutter Frontend

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 의존성 설치
        run: flutter pub get

      - name: 웹 빌드
        run: flutter build web --release

      - name: 서버로 배포
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "build/web/**/*" # 하위 폴더 및 파일 전체 구조 유지
          target: "/tmp/flutter-deploy"
          strip_components: 2

      - name: 서버에서 배포 마무리
        uses: appleboy/ssh-action@v1.2.0 # 최신 버전으로 업데이트
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            sudo rm -rf /opt/annual-leave/front/web/*
            sudo cp -r /tmp/flutter-deploy/* /opt/annual-leave/front/web/
            sudo chown -R www-data:www-data /opt/annual-leave/front/web
            rm -rf /tmp/flutter-deploy
